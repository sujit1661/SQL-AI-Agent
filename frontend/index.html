<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Studio AI — Query</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    :root {
      --purple: #a855f7;
      --pink:   #ec4899;
      --cyan:   #06b6d4;
      --border: rgba(255,255,255,0.07);
      --surface: rgba(255,255,255,0.03);
    }

    /* App shell */
    .app-shell { position: relative; z-index: 1; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ── Layout shell ── */
    .app-shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #000;
      z-index: 20;
      transition: transform 0.25s ease;
    }
    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 26px; height: 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .logo-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      color: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 3px;
      padding: 1px 4px;
    }
    .connection-dot {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .dot-pulse {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      position: relative;
      flex-shrink: 0;
    }
    .dot-pulse::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: rgba(34,197,94,0.3);
      animation: ping 1.8s ease infinite;
    }
    @keyframes ping {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .conn-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Schema list ── */
    .schema-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .schema-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      padding: 4px 12px 8px;
    }
    .table-item-btn {
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 7px;
      color: rgba(255,255,255,0.4);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      transition: background 0.15s, color 0.15s;
      text-align: left;
    }
    .table-item-btn:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.8); }
    .table-item-btn svg { flex-shrink: 0; transition: color 0.15s; }
    .table-item-btn:hover svg { color: var(--purple); }
    .table-cols {
      padding: 4px 0 8px 32px;
      border-left: 1px solid rgba(255,255,255,0.05);
      margin-left: 20px;
    }
    .col-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.25);
    }
    .col-type { color: rgba(255,255,255,0.12); font-size: 9px; }
    .empty-schema {
      padding: 16px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.15);
    }

    /* ── Main area ── */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #000;
    }

    /* ── Topbar ── */
    .topbar {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.4);
      padding: 4px;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
    }
    .hamburger:hover { color: #fff; background: rgba(255,255,255,0.05); }
    @media (max-width: 767px) {
      .hamburger { display: flex; }
      .sidebar {
        position: absolute;
        inset-y: 0; left: 0;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); box-shadow: 4px 0 40px rgba(0,0,0,0.8); }
    }
    .breadcrumb {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
    .breadcrumb span { color: rgba(255,255,255,0.7); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      transition: all 0.15s;
    }
    .icon-btn:hover { border-color: var(--border); color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.03); }
    .icon-btn svg { flex-shrink: 0; }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .chat-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      text-align: center;
      gap: 16px;
    }
    .empty-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.02);
    }
    .empty-title {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 22px;
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0;
    }
    .empty-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 6px 14px;
    }

    /* ── Message bubbles ── */
    .msg-row {
      display: flex;
      gap: 12px;
      animation: msg-in 0.28s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-avatar.ai { border-color: rgba(168,85,247,0.25); background: rgba(168,85,247,0.06); }
    .msg-body { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
    .msg-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
    .msg-row.user .msg-name { text-align: right; color: rgba(255,255,255,0.15); }
    .msg-card {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.025);
      font-size: 13px;
      line-height: 1.65;
      color: rgba(255,255,255,0.75);
    }
    .msg-row.user .msg-card {
      background: rgba(168,85,247,0.07);
      border-color: rgba(168,85,247,0.15);
      color: rgba(255,255,255,0.85);
      border-radius: 12px 12px 2px 12px;
    }
    .msg-row.ai .msg-card { border-radius: 12px 12px 12px 2px; }

    /* SQL block */
    .sql-block {
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
    }
    .sql-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
    }
    .sql-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--pink); }
    .sql-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
    .sql-pre {
      padding: 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.7;
      color: rgba(52,211,153,0.85);
      overflow-x: auto;
      white-space: pre;
      background: rgba(0,0,0,0.4);
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.06) transparent;
    }

    /* Results table */
    .results-wrap {
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
    }
    .results-scroll { overflow-x: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.06) transparent; }
    .results-table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
    .results-table th {
      text-align: left;
      padding: 8px 14px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.3);
      font-weight: 500;
      letter-spacing: 0.04em;
      font-size: 10px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .results-table td {
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.6);
      white-space: nowrap;
    }
    .results-table tr:last-child td { border-bottom: none; }
    .results-table tr:hover td { background: rgba(255,255,255,0.02); color: rgba(255,255,255,0.8); }
    .null-val { color: rgba(255,255,255,0.2); font-style: italic; }
    .results-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
    }
    .row-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.2); }
    .csv-btn {
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(52,211,153,0.6);
      transition: color 0.15s;
    }
    .csv-btn:hover { color: rgba(52,211,153,1); }

    /* Error */
    .err-card {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(239,68,68,0.06);
      border: 1px solid rgba(239,68,68,0.15);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(239,68,68,0.8);
      line-height: 1.6;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 16px;
      animation: msg-in 0.2s ease both;
    }
    .typing-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
    }
    .typing-dot:nth-child(1) { animation: bounce 1.2s 0s infinite; }
    .typing-dot:nth-child(2) { animation: bounce 1.2s 0.15s infinite; }
    .typing-dot:nth-child(3) { animation: bounce 1.2s 0.3s infinite; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); background: rgba(255,255,255,0.2); }
      40% { transform: translateY(-5px); background: var(--purple); }
    }
    .typing-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.2); margin-left: 4px; }

    /* ── Input bar ── */
    .input-bar {
      border-top: 1px solid var(--border);
      padding: 16px 20px 20px;
      flex-shrink: 0;
      background: #000;
    }
    .input-form {
      max-width: 720px;
      margin: 0 auto;
    }
    /* Glow wrapper — sits OUTSIDE input-inner so overflow:hidden doesn't clip it */
    .input-glow-wrap {
      position: relative;
      border-radius: 13px;
      padding: 1px; /* border thickness */
      background: rgba(255,255,255,0.09);
      transition: background 0.3s;
    }
    .input-form:focus-within .input-glow-wrap {
      background: linear-gradient(90deg, var(--purple), var(--pink), var(--cyan));
    }
    .input-inner {
      display: flex;
      align-items: center;
      background: #0a0a0a;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    .input-field {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      font-family: 'Inter', sans-serif;
    }
    .input-field::placeholder { color: rgba(255,255,255,0.22); font-weight: 400; }
    .input-field:disabled { opacity: 0.4; }
    .send-btn {
      margin: 5px;
      width: 36px; height: 36px;
      border-radius: 9px;
      background: #fff;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.15s, background 0.15s;
      color: #000;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .send-btn:disabled { opacity: 0.18; cursor: not-allowed; transform: none; background: rgba(255,255,255,0.5); }
    .input-hint {
      text-align: center;
      margin-top: 9px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.04em;
      font-weight: 500;
    }

    /* ── Global font weight bumps ── */
    .msg-card { font-weight: 400; color: rgba(255,255,255,0.82); }
    .msg-card p { font-weight: 400; }
    .msg-row.user .msg-card { color: rgba(255,255,255,0.92); }
    .breadcrumb span { font-weight: 600; font-size: 13px; }
    .empty-title { font-size: 24px; }
    .empty-hint { font-weight: 500; color: rgba(255,255,255,0.25); }
    .step-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; }
    .logo-name { font-weight: 700; font-size: 15px; }
    .conn-label { font-weight: 500; color: rgba(255,255,255,0.32); }
    .schema-label { font-weight: 600; }
    .table-item-btn { font-size: 12px; font-weight: 500; }
    .icon-btn { font-weight: 500; font-size: 12px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const BASE = 'http://localhost:8000';

/* ── Icons (inline SVG helpers) ── */
const Icon = ({ d, size = 14, color = 'currentColor' }) => (
  <svg width={size} height={size} viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <path d={d} stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
const ICONS = {
  table:    'M2 5h12M2 8h12M2 11h12M5 2v12M11 2v12',
  chevron:  'M5 7l3 3 3-3',
  close:    'M3 3l10 10M13 3L3 13',
  menu:     'M2 4h12M2 8h12M2 12h12',
  send:     'M2 8h12M9 3l5 5-5 5',
  trash:    'M3 5h10M6 5V3h4v2M5 5l1 8h4l1-8',
  download: 'M8 2v8M5 7l3 3 3-3M3 13h10',
  bot:      'M6 2h4v3H6zM4 5h8v6H4zM6 11v3M10 11v3M2 7h2M12 7h2',
  user:     'M8 7a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 14a5 5 0 0 1 10 0',
  home:     'M2 8L8 2l6 6M4 7v7h3v-4h2v4h3V7',
  profile:  'M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 14s1-4 6-4 6 4 6 4',
};

/* ── TableItem ── */
function TableItem({ name, cols }) {
  const [open, setOpen] = useState(false);
  return (
    <div>
      <button className="table-item-btn" onClick={() => setOpen(o => !o)}
        aria-expanded={open} aria-controls={`cols-${name}`}>
        <Icon d={open ? ICONS.table : ICONS.table} size={13} color="rgba(255,255,255,0.3)" />
        <span style={{flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{name}</span>
        <Icon d={ICONS.chevron} size={11} color="rgba(255,255,255,0.2)"
          style={{ transform: open ? 'rotate(180deg)' : 'none', transition:'transform 0.2s' }} />
      </button>
      {open && (
        <div className="table-cols" id={`cols-${name}`}>
          {cols.map((c, i) => {
            const parts = c.match(/^(.+?)\s+\((.+)\)$/);
            return (
              <div className="col-row" key={i}>
                <span>{parts ? parts[1] : c}</span>
                <span className="col-type">{parts ? parts[2] : ''}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ── MessageBubble ── */
function MessageBubble({ msg }) {
  const isAI = msg.role === 'ai';

  const downloadCSV = () => {
    if (!msg.data?.length) return;
    const headers = Object.keys(msg.data[0]);
    const lines = [
      headers.join(','),
      ...msg.data.map(row =>
        headers.map(k => {
          const v = row[k] == null ? '' : String(row[k]);
          return `"${v.replace(/"/g, '""')}"`;
        }).join(',')
      )
    ];
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'results.csv';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  return (
    <div className={`msg-row ${isAI ? 'ai' : 'user'}`}>
      <div className={`msg-avatar ${isAI ? 'ai' : ''}`}>
        <Icon d={isAI ? ICONS.bot : ICONS.user} size={13}
          color={isAI ? 'rgba(168,85,247,0.7)' : 'rgba(255,255,255,0.3)'} />
      </div>
      <div className="msg-body">
        <span className="msg-name">{isAI ? 'SQL Agent' : 'You'}</span>
        <div className="msg-card">
          {msg.text && <p>{msg.text}</p>}
          {msg.sql && (
            <div className="sql-block">
              <div className="sql-header">
                <div className="sql-dot" />
                <span className="sql-label">Generated SQL</span>
              </div>
              <pre className="sql-pre">{msg.sql}</pre>
            </div>
          )}
          {msg.data?.length > 0 && (
            <div className="results-wrap">
              <div className="results-scroll">
                <table className="results-table">
                  <thead>
                    <tr>{Object.keys(msg.data[0]).map(k => <th key={k}>{k}</th>)}</tr>
                  </thead>
                  <tbody>
                    {msg.data.map((row, i) => (
                      <tr key={i}>
                        {Object.values(row).map((v, j) => (
                          <td key={j}>{v === null ? <span className="null-val">null</span> : String(v)}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="results-footer">
                <span className="row-count">{msg.data.length} rows</span>
                <button className="csv-btn" onClick={downloadCSV} type="button"
                  aria-label="Download results as CSV">
                  <Icon d={ICONS.download} size={11} color="currentColor" />
                  <span>CSV</span>
                </button>
              </div>
            </div>
          )}
          {msg.error && <div className="err-card">{msg.error}</div>}
        </div>
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const [schema, setSchema] = useState({});
  const [messages, setMessages] = useState([
    { role: 'ai', text: "Connected to your PostgreSQL database. Ask me anything about your data." }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  const isEmptyState = messages.length === 1 && messages[0].role === 'ai';

  useEffect(() => {
    fetch(`${BASE}/schema`)
      .then(r => r.json())
      .then(d => setSchema(d.raw_schema || d))
      .catch(() => {});
  }, []);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, loading]);

  const send = async (e) => {
    e.preventDefault();
    const q = input.trim();
    if (!q || loading) return;
    setInput('');
    setMessages(prev => [...prev, { role: 'user', text: q }]);
    setLoading(true);
    try {
      const res = await fetch(`${BASE}/generate?question=${encodeURIComponent(q)}`, { method: 'POST' });
      const d = await res.json();
      const sql = d.sql || d.generated_sql || null;
      const data = d.results || d.data || [];
      const error = d.error || null;
      setMessages(prev => [...prev, {
        role: 'ai',
        text: error ? "I ran into an issue with that request."
              : sql  ? "Here are the results from your database:"
                     : (d.message || "I couldn't generate SQL for that."),
        sql, data: error ? [] : data, error
      }]);
    } catch {
      setMessages(prev => [...prev, { role: 'ai', error: "Failed to reach backend. Is it running on port 8000?" }]);
    } finally {
      setLoading(false);
      setTimeout(() => inputRef.current?.focus(), 50);
    }
  };

  const clearChat = () => {
    setMessages([{ role: 'ai', text: "Connected to your PostgreSQL database. Ask me anything about your data." }]);
    setTimeout(() => inputRef.current?.focus(), 50);
  };

  return (
    <div className="app-shell">
      {/* Mobile backdrop */}
      {sidebarOpen && (
        <div onClick={() => setSidebarOpen(false)} aria-hidden="true"
          style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:10}} />
      )}

      {/* ── Sidebar ── */}
      <aside className={`sidebar${sidebarOpen ? ' open' : ''}`} aria-label="Database schema">
        <div className="sidebar-header">
          <a href="/" className="sidebar-logo" aria-label="Back to home">
            <div className="logo-icon">
              <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M2 4h10M2 7h7M2 10h5" stroke="white" strokeWidth="1.6" strokeLinecap="round"/>
              </svg>
            </div>
            <span className="logo-name">SQL Studio</span>
            <span className="logo-badge">AI</span>
          </a>
          <div className="connection-dot">
            <div className="dot-pulse" aria-hidden="true" />
            <span className="conn-label">PostgreSQL Connected</span>
          </div>
        </div>
        <div className="schema-list" role="navigation" aria-label="Database tables">
          <div className="schema-label">Tables ({Object.keys(schema).length})</div>
          {Object.keys(schema).length === 0
            ? <div className="empty-schema">No tables found or backend offline.</div>
            : Object.entries(schema).map(([t, c]) => <TableItem key={t} name={t} cols={c} />)
          }
        </div>
      </aside>

      {/* ── Main ── */}
      <main className="main-area">
        {/* Topbar */}
        <header className="topbar">
          <div className="topbar-left">
            <button className="hamburger" onClick={() => setSidebarOpen(o => !o)}
              aria-label="Toggle sidebar" aria-expanded={sidebarOpen}>
              <Icon d={sidebarOpen ? ICONS.close : ICONS.menu} size={16} />
            </button>
            <div className="breadcrumb">
              <span>Natural Language Query</span>
            </div>
          </div>
          <div className="topbar-actions">
            <a href="/profile" className="icon-btn" aria-label="View profile">
              <Icon d={ICONS.profile} size={13} />
              <span style={{display:'none'}}>Profile</span>
            </a>
            <button className="icon-btn" onClick={clearChat} aria-label="Clear conversation" type="button">
              <Icon d={ICONS.trash} size={13} />
              <span>Clear</span>
            </button>
          </div>
        </header>

        {/* Chat */}
        <div className="chat-area" role="log" aria-label="Conversation" aria-live="polite">
          <div className="chat-inner">
            {isEmptyState && (
              <div className="empty-state">
                <div className="empty-icon">
                  <Icon d={ICONS.bot} size={20} color="rgba(168,85,247,0.5)" />
                </div>
                <div className="empty-title">Ask your database anything</div>
                <div className="empty-hint">"Show me the top 10 users by revenue"</div>
              </div>
            )}
            {messages.map((m, i) => <MessageBubble key={i} msg={m} />)}
            {loading && (
              <div className="msg-row ai">
                <div className="msg-avatar ai">
                  <Icon d={ICONS.bot} size={13} color="rgba(168,85,247,0.7)" />
                </div>
                <div className="msg-body">
                  <span className="msg-name">SQL Agent</span>
                  <div className="msg-card">
                    <div className="typing">
                      <div className="typing-dot" /><div className="typing-dot" /><div className="typing-dot" />
                      <span className="typing-label">Generating SQL…</span>
                    </div>
                  </div>
                </div>
              </div>
            )}
            <div ref={bottomRef} />
          </div>
        </div>

        {/* Input */}
        <div className="input-bar">
          <form className="input-form" onSubmit={send} aria-label="Query input">
            <div className="input-glow-wrap">
              <div className="input-inner">
                <label htmlFor="q-input" style={{position:'absolute',width:'1px',height:'1px',overflow:'hidden',clip:'rect(0,0,0,0)'}}>
                  Ask a question about your data
                </label>
                <input id="q-input" ref={inputRef} className="input-field"
                  type="text" autoComplete="off" value={input} disabled={loading}
                  onChange={e => setInput(e.target.value)}
                  placeholder="Ask a question about your data…" />
                <button className="send-btn" type="submit" disabled={loading || !input.trim()}
                  aria-label="Send">
                  <Icon d={ICONS.send} size={14} color="#000" />
                </button>
              </div>
            </div>
            <p className="input-hint">AI can make mistakes — always verify generated SQL</p>
          </form>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
